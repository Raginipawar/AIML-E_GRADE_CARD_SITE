spring.application.name=gradecard

# Default (local) datasource: file-based H2, zero install. Every classmate can
# just run ./mvnw spring-boot:run and it works. For the real MySQL demo run
# with --spring.profiles.active=mysql (see application-mysql.properties and
# ../docker-compose.yml).
spring.datasource.url=jdbc:h2:file:./data/aiml-gradecard;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# "year" (a Subject column) is a reserved word in both H2 and MySQL (YEAR type)
# -- quote every identifier so entity field names never collide with SQL keywords.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}
