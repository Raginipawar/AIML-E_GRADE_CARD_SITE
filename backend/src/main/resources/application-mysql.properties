# Real MySQL profile, for the official assignment demo / Postman + MySQL
# Workbench screenshots. Matches docker-compose.yml (db: mysql:8, port 3306,
# database "aiml_gradecard", user "root" / password "gradecard").
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/aiml_gradecard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=gradecard

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.h2.console.enabled=false
